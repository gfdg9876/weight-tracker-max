<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Трекер веса</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f6fb;--card:#fff;--text:#171923;--muted:#7b8190;
  --line:#e9ebf2;--accent:#6757e8;--accent2:#8b7cf6;
}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
body{padding-bottom:30px}
button,input{font:inherit}
.app{max-width:680px;margin:0 auto;padding:18px 16px 30px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;gap:12px;align-items:center}
 .logo{
  width:48px;height:48px;
  border-radius:15px;
  background:linear-gradient(135deg,#7064ee,#5144c8);
  color:#fff;
  display:grid;
  place-items:center;
  font-size:24px;
  box-shadow:0 8px 22px #6559dc33;
  animation:logoFloat 3s ease-in-out infinite;
}
@keyframes logoFloat{
  0%,100%{transform:translateY(0) rotate(0)}
  50%{transform:translateY(-3px) rotate(-2deg)}
}
h1{font-size:24px;margin:0;font-weight:800}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.iconbtn{border:0;background:#fff;width:44px;height:44px;border-radius:14px;cursor:pointer;box-shadow:0 5px 18px #2221}
 .card{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:26px;
  padding:20px;
  margin-bottom:14px;
  box-shadow:0 14px 45px #24284012;
  animation:cardIn .65s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .25s ease,box-shadow .25s ease;
}
.card:nth-of-type(2){animation-delay:.05s}
.card:nth-of-type(3){animation-delay:.1s}
.card:nth-of-type(4){animation-delay:.15s}
@keyframes cardIn{
  from{opacity:0;transform:translateY(18px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media (hover:hover){
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 55px #24284018;
  }
}
 .hero{
  background:linear-gradient(135deg,#5d50df 0%,#7567ec 48%,#9287f8 100%);
  color:#fff;
  position:relative;
  overflow:hidden;
  border:0;
  box-shadow:0 18px 50px #6757e844;
}
.hero:before{
  content:"";
  position:absolute;
  width:280px;height:280px;
  right:-115px;top:-125px;
  border-radius:50%;
  background:rgba(255,255,255,.11);
  animation:orb 7s ease-in-out infinite;
}
@keyframes orb{
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-15px,18px) scale(1.08)}
}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-80px;top:-90px;background:#ffffff15}
.label{font-size:13px;opacity:.8}.current{font-size:42px;font-weight:850;line-height:1.05;margin-top:6px}
.goaltext{margin-top:8px;font-size:14px;opacity:.85}
.progress{height:10px;background:#ffffff35;border-radius:99px;margin-top:18px;overflow:hidden}
 .progress>div{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#fff,#eeeaff);
  border-radius:99px;
  transition:width 1s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 16px #fff8;
  position:relative;
  overflow:hidden;
}
.progress>div:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,#ffffff99,transparent);
  transform:translateX(-100%);
  animation:shine 2.2s ease-in-out infinite;
}
@keyframes shine{to{transform:translateX(100%)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:#ffffff16;border-radius:14px;padding:10px}.stat b{display:block;font-size:17px}.stat span{font-size:11px;opacity:.72}
.cardtitle{font-size:17px;font-weight:800;margin-bottom:14px}
 .chartbox{
  height:310px;
  position:relative;
  border-radius:19px;
  background:linear-gradient(180deg,#fbfbff,#f7f7fc);
  overflow:visible;
  border:1px solid #eff0f5;
}
#chart{width:100%;height:100%;display:block} #chart polyline{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLine .8s ease forwards} #chart circle{animation:pop .35s ease both}@keyframes drawLine{to{stroke-dashoffset:0}}@keyframes pop{from{transform:scale(.5);transform-origin:center}to{transform:scale(1)}}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .btn{
  border:0;
  border-radius:18px;
  padding:15px 12px;
  font-weight:750;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease;
}
.btn:active{transform:scale(.96)}
.primary{
  background:linear-gradient(135deg,#171923,#30313d);
  color:#fff;
  box-shadow:0 8px 22px #17192324;
}
.primary:hover{box-shadow:0 12px 28px #17192332;transform:translateY(-1px)}
.secondary{background:#f0f0f5;color:#171923}
.secondary:hover{background:#e8e8ef}
.history{display:flex;flex-direction:column;gap:0}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.date{font-size:13px;color:var(--muted)}.weight{font-weight:800}
.empty{text-align:center;color:var(--muted);padding:18px 0;font-size:14px}
.modal{position:fixed;inset:0;background:#11131d80;display:none;align-items:flex-end;justify-content:center;z-index:20}
 .modal.show{
  display:flex;
  animation:modalBg .25s ease both;
}
@keyframes modalBg{from{opacity:0}to{opacity:1}}
.sheet{
  width:min(680px,100%);
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:30px 30px 0 0;
  padding:22px 18px 28px;
  box-shadow:0 -18px 50px #11132522;
  animation:sheetIn .4s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes sheetIn{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}
.sheet h2{margin:0 0 18px;font-size:23px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;border:1px solid #dfe1e9;border-radius:15px;padding:15px;font-size:18px;outline:none;background:#fafafd}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6757e822}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#171923;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;font-size:14px}
 .toast.show{
  opacity:1;
  transform:translate(-50%,0);
  animation:toastPop .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes toastPop{
  0%{transform:translate(-50%,15px) scale(.92)}
  100%{transform:translate(-50%,0) scale(1)}
}
@media(max-width:430px){.app{padding:14px 12px}.current{font-size:38px}.chartbox{height:275px}.stats{gap:6px}.stat{padding:9px 7px}}
@keyframes pointIn{
  from{opacity:0;transform:scale(.3)}
  70%{transform:scale(1.18)}
  to{opacity:1;transform:scale(1)}
}
@keyframes drawLine{
  from{stroke-dashoffset:1000}
  to{stroke-dashoffset:0}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
    transition-duration:.01ms!important;
  }
}

/* ===== THEMES ===== */
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#171923;
  --muted:#7b8190;
  --line:#e9ebf2;
  --surface:#fafafe;
  --input:#fafafd;
  --input-border:#dfe1e9;
  --secondary:#f0f0f5;
  --accent:#6757e8;
  --grid:#e9ebf2;
}

html[data-theme="dark"]{
  --bg:#0d0f14;
  --card:#171a22;
  --text:#f4f5f8;
  --muted:#9ba1b0;
  --line:#292d38;
  --surface:#12151c;
  --input:#11141b;
  --input-border:#303541;
  --secondary:#272b35;
  --accent:#8b7cf6;
  --grid:#292d38;
}

html[data-theme="dark"] body{
  background:
    radial-gradient(circle at 10% 0%, #2b245d55 0, transparent 32%),
    radial-gradient(circle at 100% 15%, #162b4d55 0, transparent 28%),
    var(--bg);
  color:var(--text);
}

html[data-theme="dark"] .card{
  background:rgba(23,26,34,.88);
  border-color:#ffffff0b;
  box-shadow:0 14px 45px #00000030;
}

html[data-theme="dark"] .iconbtn{
  background:#191c25;
  color:#fff;
  box-shadow:0 5px 18px #0005;
}

html[data-theme="dark"] .chartbox{
  background:linear-gradient(180deg,#151821,#11141b);
  border-color:#292d38;
}

html[data-theme="dark"] .secondary{
  background:#292d38;
  color:#f4f5f8;
}

html[data-theme="dark"] .secondary:hover{
  background:#333844;
}

html[data-theme="dark"] input{
  background:var(--input);
  color:var(--text);
  border-color:var(--input-border);
}

html[data-theme="dark"] input::placeholder{
  color:#777d8c;
}

html[data-theme="dark"] .modal .sheet{
  background:rgba(23,26,34,.97);
  color:var(--text);
}

html[data-theme="dark"] .row{
  border-color:var(--line);
}

html[data-theme="dark"] .empty{
  color:var(--muted);
}

html[data-theme="dark"] .chart-empty{
  color:var(--muted);
}

/* Переключатель темы */
.theme-toggle{
  position:relative;
  width:50px;
  height:50px;
  border:0;
  border-radius:16px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  box-shadow:0 7px 22px #24284012;
  font-size:21px;
  transition:transform .2s ease,background .25s ease;
}
.theme-toggle:active{transform:scale(.92)}
.theme-icon{display:inline-block;transition:transform .35s ease}
html[data-theme="dark"] .theme-icon{transform:rotate(180deg)}

.top-actions{
  display:flex;
  gap:8px;
  align-items:center;
}


#celebrationLayer{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.confetti-piece{position:absolute;top:-24px;width:10px;height:18px;border-radius:3px;opacity:0;animation:confettiFly var(--dur) cubic-bezier(.12,.75,.2,1) forwards;animation-delay:var(--delay)}
@keyframes confettiFly{0%{opacity:0;transform:translate3d(var(--sx),-30px,0) rotate(0) scale(.7)}8%{opacity:1}100%{opacity:1;transform:translate3d(var(--ex),var(--ey),0) rotate(var(--rot)) scale(1)}}
.firework{position:absolute;width:8px;height:8px;border-radius:50%;opacity:0;animation:fireworkPop .9s ease-out forwards}
.firework i{position:absolute;left:50%;top:50%;width:4px;height:72px;transform-origin:50% 100%;border-radius:999px;background:currentColor;transform:translate(-50%,-100%) rotate(var(--angle)) scaleY(0);animation:rayShoot .76s cubic-bezier(.15,.75,.2,1) forwards}
@keyframes fireworkPop{0%{opacity:0;transform:scale(.1)}15%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
@keyframes rayShoot{0%{transform:translate(-50%,-100%) rotate(var(--angle)) scaleY(0)}45%{transform:translate(-50%,-100%) rotate(var(--angle)) scaleY(1)}100%{transform:translate(-50%,-100%) rotate(var(--angle)) scaleY(.15);opacity:0}}
.celebrate-flash{position:fixed;inset:0;z-index:9998;pointer-events:none;background:rgba(255,255,255,.4);animation:flash .45s ease-out forwards}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
</style>
</head>

<script>
try {
  if (localStorage.getItem("weightTrackerFreshStart_v1") !== "done") {
    localStorage.removeItem("max_weight_tracker_v3");
    localStorage.setItem("weightTrackerFreshStart_v1", "done");
  }
} catch(e) {}
</script>

<body><div id="celebrationLayer"></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">⚖</div>
      <div><h1>Трекер веса</h1><div class="sub">Достигай цели каждый день</div></div>
    </div>
    <div class="top-actions">
      <button class="theme-toggle" id="themeToggle" type="button" onclick="toggleTheme()" aria-label="Переключить тему">
        <span class="theme-icon" id="themeIcon">☀️</span>
      </button>
      <button class="iconbtn" onclick="openGoal()">⚙️</button>
    </div>
  </header>

  <section class="card hero">
    <div class="label">ТЕКУЩИЙ ВЕС</div>
    <div class="current" id="current">—</div>
    <div class="goaltext" id="goalText">Сначала задай цель</div>
    <div class="progress"><div id="bar"></div></div>
    <div class="stats">
      <div class="stat"><b id="percent">0%</b><span>выполнено</span></div>
      <div class="stat"><b id="left">—</b><span>до цели</span></div>
      <div class="stat"><b id="count">0</b><span>измерений</span></div>
    </div>
  </section>

  <section class="card">
    <div class="cardtitle">Динамика веса</div>
    <div class="chartbox">
      <svg id="chart" viewBox="0 0 600 300" preserveAspectRatio="none"></svg>
      <div class="chart-empty" id="chartEmpty">Добавь первое измерение,<br>и появится линия прогресса.</div>
    </div>
  </section>

  <section class="card">
    <div class="actions">
      <button class="btn primary" id="weightButton" onclick="openWeight()">＋ Записать вес</button>
      <button class="btn secondary" onclick="openGoal()">⚙️ Цель</button>
    </div>
  </section>

  <section class="card">
    <div class="cardtitle">История измерений</div>
    <div class="history" id="history"></div>
  </section>
</div>

<div class="modal" id="goalModal">
  <div class="sheet">
    <h2>🎯 Цель веса</h2>
    <div class="field"><label>Начальный вес, кг</label><input id="start" type="number" min="1" max="500" step="0.1" placeholder="Например, 80"></div>
    <div class="field"><label>Целевой вес, кг</label><input id="target" type="number" min="1" max="500" step="0.1" placeholder="Например, 70"></div>
    <div class="modal-actions">
      <button class="btn primary" onclick="saveGoal()">Сохранить</button>
      <button class="btn secondary" onclick="closeModals()">Отмена</button>
    </div>
  </div>
</div>

<div class="modal" id="weightModal">
  <div class="sheet">
    <h2>⚖️ Сегодняшний вес</h2>
    <div class="field"><label>Вес, кг</label><input id="weight" type="number" min="1" max="500" step="0.1" placeholder="Например, 78.4"></div>
    <div class="modal-actions">
      <button class="btn primary" onclick="saveWeight()">Сохранить</button>
      <button class="btn secondary" onclick="closeModals()">Отмена</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY="max_weight_tracker_v3";
let data={start:null,target:null,measurements:[]};

try{
  const saved=JSON.parse(localStorage.getItem(KEY)||"null");
  if(saved && Array.isArray(saved.measurements)) data=saved;
}catch(e){}

const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toFixed(1)+" кг";

function save(){localStorage.setItem(KEY,JSON.stringify(data));}

// Миграция старых записей v2/v1 в новый формат с timestamp.
(function migrateOldData(){
  let changed=false;

  data.measurements=(data.measurements||[]).map((m,i)=>{
    if(m.timestamp){
      return m;
    }

    if(m.date){
      const timestamp=`${m.date}T12:00:00`;
      changed=true;
      return {
        id:String(Date.now())+i,
        timestamp,
        weight:Number(m.weight)
      };
    }

    return m;
  }).filter(m=>valid(Number(m.weight)));

  if(changed)save();
})();


function nowISO(){
  return new Date().toISOString();
}

function dateKey(iso){
  const d=new Date(iso);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function dateTimeText(iso){
  const d=new Date(iso);
  const dd=String(d.getDate()).padStart(2,"0");
  const mm=String(d.getMonth()+1).padStart(2,"0");
  const yyyy=d.getFullYear();
  const hh=String(d.getHours()).padStart(2,"0");
  const min=String(d.getMinutes()).padStart(2,"0");
  return `${dd}.${mm}.${yyyy} ${hh}:${min}`;
}

function dateText(iso){
  const d=new Date(iso);
  const dd=String(d.getDate()).padStart(2,"0");
  const mm=String(d.getMonth()+1).padStart(2,"0");
  return `${dd}.${mm}`;
}
function toast(t){
  $("toast").textContent=t;$("toast").classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.remove("show"),1800);
}
function openGoal(){
  $("start").value=data.start??"";
  $("target").value=data.target??"";
  $("goalModal").classList.add("show");
}
function openWeight(){
  if(data.start===null||data.target===null){
    openGoal();
    toast("Сначала задай цель");
    return;
  }

  // Только одно измерение за календарные сутки.
$("weight").value="";
  $("weightModal").classList.add("show");
  setTimeout(()=>$("weight").focus(),100);
}
function closeModals(){document.querySelectorAll(".modal").forEach(x=>x.classList.remove("show"));}

function valid(v){return Number.isFinite(v)&&v>0&&v<=500;}

function saveGoal(){
  const s=Number($("start").value), t=Number($("target").value);
  if(!valid(s)||!valid(t)){toast("Введи корректные значения");return;}
  data.start=s;data.target=t;

  // Старые измерения не удаляем при сохранении цели.
  // Начальный вес хранится отдельно и не считается ежедневным измерением.
  save();
  closeModals();
  render();
  toast("Цель сохранена");
}

function launchCelebration(){
  const layer=document.getElementById("celebrationLayer");
  if(!layer)return;
  layer.innerHTML='<div class="celebrate-flash"></div>';
  const colors=["#ff4d6d","#7c5cff","#00c2ff","#20c997","#ffc107","#ff7a00","#e83e8c"];
  for(let i=0;i<90;i++){
    const el=document.createElement("span");
    el.className="confetti-piece";
    el.style.left=(6+Math.random()*88)+"%";
    el.style.background=colors[i%colors.length];
    el.style.setProperty("--sx",(Math.random()-.5)*100+"px");
    el.style.setProperty("--ex",(Math.random()-.5)*560+"px");
    el.style.setProperty("--ey",(55+Math.random()*55)*innerHeight/100+"px");
    el.style.setProperty("--rot",(180+Math.random()*900)+"deg");
    el.style.setProperty("--dur",(1.35+Math.random()*1.35)+"s");
    el.style.setProperty("--delay",(Math.random()*.25)+"s");
    layer.appendChild(el);
  }
  [["24%","38%","#ff4d6d"],["76%","34%","#7c5cff"],["50%","25%","#00c2ff"]].forEach(pos=>{
    const fw=document.createElement("div");
    fw.className="firework"; fw.style.left=pos[0]; fw.style.top=pos[1]; fw.style.color=pos[2];
    for(let a=0;a<360;a+=30){
      const ray=document.createElement("i");
      ray.style.setProperty("--angle",a+"deg"); fw.appendChild(ray);
    }
    layer.appendChild(fw);
  });
  setTimeout(()=>layer.innerHTML="",3600);
}

function saveWeight(){
  const previousWeight = data.measurements.length
    ? Number(data.measurements[data.measurements.length-1].weight)
    : (data.start === null ? null : Number(data.start));

  const w=Number($("weight").value);
  if(!valid(w)){
    toast("Введи корректный вес");
    return;
  }

  const stamp=nowISO();
  const todayKey=dateKey(stamp);

  // За одни календарные сутки разрешена только одна запись.
  const alreadyToday=data.measurements.some(
    x=>dateKey(x.timestamp)===todayKey
  );

  if(alreadyToday){
    closeModals();
    toast("Сегодня вес уже записан");
    return;
  }

  data.measurements.push({
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
    timestamp: stamp,
    weight: w
  });

  data.measurements.sort(
    (a,b)=>new Date(a.timestamp)-new Date(b.timestamp)
  );

  save();
  closeModals();
  render();
  toast("Вес сохранён");

  if(previousWeight !== null && w < previousWeight) launchCelebration();
}

function progress(current){
  if(data.start===null||data.target===null||data.start===data.target)return 100;
  return Math.max(0,Math.min(100,(data.start-current)/(data.start-data.target)*100));
}

function render(){
  if(data.start===null||data.target===null){
    $("current").textContent="—";$("goalText").textContent="Сначала задай цель";
    $("percent").textContent="0%";$("left").textContent="—";$("count").textContent="0";
    $("bar").style.width="0%";
    renderHistory();
    drawChart();
    updateWeightButton();
    return;
  }
  const arr=data.measurements;
  const current=arr.length?arr[arr.length-1].weight:data.start;
  const p=progress(current);
  $("current").textContent=fmt(current);
  $("current").animate(
    [
      {transform:"scale(.92)",opacity:.55},
      {transform:"scale(1.04)",opacity:1},
      {transform:"scale(1)",opacity:1}
    ],
    {duration:420,easing:"cubic-bezier(.2,.8,.2,1)"}
  );
  $("goalText").textContent=`Начало ${fmt(data.start)}  →  Цель ${fmt(data.target)}`;
  $("percent").textContent=Math.round(p)+"%";
  $("left").textContent=fmt(Math.abs(current-data.target));
  $("count").textContent=arr.length;
  $("bar").style.width=p+"%";
  renderHistory();
  drawChart();
  updateWeightButton();
}

function updateWeightButton(){
  const btn=$("weightButton");
  if(!btn)return;

  if(data.start===null||data.target===null){
    btn.textContent="＋ Записать вес";
    btn.disabled=false;
    return;
  }

  const todayKey=dateKey(nowISO());
  const alreadyToday=data.measurements.some(
    x=>dateKey(x.timestamp)===todayKey
  );

  btn.disabled=alreadyToday;
  btn.textContent=alreadyToday
    ? "✓ Вес за сегодня записан"
    : "＋ Записать вес";

  btn.style.opacity=alreadyToday ? ".6" : "1";
  btn.style.cursor=alreadyToday ? "not-allowed" : "pointer";
}

function renderHistory(){
  const h=$("history");

  if(!data.measurements.length){
    h.innerHTML='<div class="empty">Пока нет измерений</div>';
    return;
  }

  h.innerHTML=data.measurements
    .slice()
    .reverse()
    .map(x=>`
      <div class="row">
        <div>
          <div class="weight">${fmt(x.weight)}</div>
          <div class="date">${dateTimeText(x.timestamp)}</div>
        </div>
      </div>
    `).join("");
}
function getChartPoints(){
  const measurements=data.measurements
    .slice()
    .sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));

  // Начальная точка отдельно + ВСЕ сохранённые измерения.
  return [
    {
      timestamp: measurements.length ? measurements[0].timestamp : nowISO(),
      weight: data.start,
      initial: true
    },
    ...measurements.map(x=>({
      timestamp:x.timestamp,
      weight:x.weight,
      initial:false
    }))
  ];
}

function drawChart(){
  const svg=$("chart");

  if(data.start===null||data.target===null){
    svg.innerHTML="";
    $("chartEmpty").style.display="grid";
    return;
  }

  const arr=getChartPoints();

  $("chartEmpty").style.display="none";

  const W=600,H=300,L=48,R=18,T=22,B=42;

  let vals=arr.map(x=>x.weight).concat([data.target,data.start]);
  let min=Math.min(...vals);
  let max=Math.max(...vals);
  let range=max-min||2;

  min-=range*.12;
  max+=range*.12;

  const x=i=>arr.length===1
    ? W/2
    : L+i*((W-L-R)/(arr.length-1));

  const y=v=>T+(max-v)/(max-min)*(H-T-B);

  let out="";

  for(let i=0;i<5;i++){
    const yy=T+i*(H-T-B)/4;
    const vv=max-i*(max-min)/4;

    out+=`
      <line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"
            stroke="var(--grid)" stroke-width="1"/>
      <text x="6" y="${yy+4}" font-size="12"
            fill="var(--muted)">${vv.toFixed(1)}</text>
    `;
  }

  const targetY=y(data.target);

  out+=`
    <line x1="${L}" y1="${targetY}" x2="${W-R}" y2="${targetY}"
          stroke="#8a82ee" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="${W-R-4}" y="${targetY-7}" text-anchor="end"
          font-size="12" fill="#6757e8">цель ${data.target.toFixed(1)}</text>
  `;

  // ЛИНИЯ ИДЁТ ЧЕРЕЗ КАЖДУЮ СОХРАНЁННУЮ ТОЧКУ.
  if(arr.length>=2){
    const points=arr.map((v,i)=>`${x(i)},${y(v.weight)}`).join(" ");

    out+=`
      <polyline
        points="${points}"
        fill="none"
        stroke="#6757e8"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        style="stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLine 1.25s cubic-bezier(.2,.8,.2,1) forwards"
      />
    `;
  }

  arr.forEach((v,i)=>{
    const cx=x(i);
    const cy=y(v.weight);

    // У каждой точки своя зона клика/наведения.
    out+=`
      <circle
        cx="${cx}"
        cy="${cy}"
        r="17"
        fill="transparent"
        style="cursor:pointer"
        data-point="${i}"
        onmouseenter="showPointTooltip(${i})"
        onmouseleave="hidePointTooltip()"
        ontouchstart="showPointTooltip(${i})"
      />
    `;

    out+=`
      <circle
        cx="${cx}"
        cy="${cy}"
        r="6"
        fill="#fff"
        stroke="#6757e8"
        stroke-width="4"
        pointer-events="none"
        style="filter:drop-shadow(0 2px 5px #6757e855);animation:pointIn .45s cubic-bezier(.2,.8,.2,1) both"
      />
    `;

    out+=`
      <text
        x="${cx}"
        y="${H-13}"
        text-anchor="middle"
        font-size="11"
        fill="var(--muted)"
      >${dateText(v.timestamp)}</text>
    `;

    if(i===0 || i===arr.length-1){
      const labelY=Math.max(16,cy-12);

      out+=`
        <text
          x="${cx}"
          y="${labelY}"
          text-anchor="middle"
          font-size="12"
          font-weight="700"
          fill="#6757e8"
          pointer-events="none"
        >${v.weight.toFixed(1)} кг</text>
      `;
    }
  });

  // Всплывающая информация: дата + точное время + вес.
  out+=`
    <g id="pointTooltip" display="none" pointer-events="none">
      <rect id="tooltipBg" x="0" y="0" width="190" height="64"
            rx="10" fill="#171923"/>
      <text id="tooltipTitle" x="12" y="20"
            font-size="12" font-weight="700" fill="#fff"></text>
      <text id="tooltipDate" x="12" y="39"
            font-size="11" fill="#d9dbe3"></text>
      <text id="tooltipWeight" x="12" y="55"
            font-size="12" font-weight="700" fill="#fff"></text>
    </g>
  `;

  svg.innerHTML=out;
}

function showPointTooltip(index){
  const svg=$("chart");
  const tip=svg.querySelector("#pointTooltip");
  const bg=svg.querySelector("#tooltipBg");
  const title=svg.querySelector("#tooltipTitle");
  const dateEl=svg.querySelector("#tooltipDate");
  const weightEl=svg.querySelector("#tooltipWeight");

  if(!tip)return;

  const arr=getChartPoints();
  const p=arr[index];
  if(!p)return;

  title.textContent=p.initial ? "Начальный вес" : "Измерение";
  dateEl.textContent=dateTimeText(p.timestamp);
  weightEl.textContent=`Вес: ${p.weight.toFixed(1)} кг`;

  const W=600,H=300,L=48,R=18,T=22,B=42;

  let vals=arr.map(x=>x.weight).concat([data.target,data.start]);
  let min=Math.min(...vals);
  let max=Math.max(...vals);
  let range=max-min||2;

  min-=range*.12;
  max+=range*.12;

  const cx=arr.length===1
    ? W/2
    : L+index*((W-L-R)/(arr.length-1));

  const cy=T+(max-p.weight)/(max-min)*(H-T-B);

  let tx=cx+12;
  let ty=cy-76;

  if(tx+190>W)tx=cx-202;
  if(tx<0)tx=4;
  if(ty<4)ty=cy+14;

  bg.setAttribute("x",tx);
  bg.setAttribute("y",ty);

  title.setAttribute("x",tx+12);
  title.setAttribute("y",ty+20);

  dateEl.setAttribute("x",tx+12);
  dateEl.setAttribute("y",ty+39);

  weightEl.setAttribute("x",tx+12);
  weightEl.setAttribute("y",ty+55);

  tip.setAttribute("display","block");
}

function hidePointTooltip(){
  const tip=$("chart").querySelector("#pointTooltip");
  if(tip)tip.setAttribute("display","none");
}
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)closeModals();}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModals();});

// ===== THEME =====
function getSavedTheme(){
  try{
    return localStorage.getItem("weightTrackerTheme") || "light";
  }catch(e){
    return "light";
  }
}

function applyTheme(theme){
  const normalized=theme==="dark" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme",normalized);

  const icon=$("themeIcon");
  if(icon) icon.textContent=normalized==="dark" ? "🌙" : "☀️";

  try{
    localStorage.setItem("weightTrackerTheme",normalized);
  }catch(e){}

  // Перерисовываем график, чтобы сетка и подписи сразу приняли новую тему.
  if(typeof drawChart==="function") drawChart();
}

function toggleTheme(){
  const current=document.documentElement.getAttribute("data-theme") || "light";
  applyTheme(current==="dark" ? "light" : "dark");
}

applyTheme(getSavedTheme());


render();
</script>
</body>
</html>
